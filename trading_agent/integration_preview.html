<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>联调预览 · 策略扫描 + 回写结果（真实数据快照）</title>
<style>
  :root{ --bg:#0b0f17; --panel:#111827; --border:rgba(148,163,184,.2); --muted:#64748b; --text:#e2e8f0; --up:#ef4444; --down:#22c55e; --accent:#2563eb; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding:28px;line-height:1.5}
  h1{font-size:20px;margin:0 0 4px}
  .eyebrow{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin:16px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
  .stat{border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .stat .l{font-size:12px;color:var(--muted)} .stat .v{font-size:22px;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid rgba(148,163,184,.12)}
  th{color:var(--muted);font-weight:600}
  .up{color:var(--up)} .down{color:var(--down)}
  .banner{border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;background:rgba(37,99,235,.08);margin:12px 0;font-size:13px}
  .banner.warn{border-left-color:#f59e0b;background:rgba(245,158,11,.08)}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;border:1px solid currentColor}
  .muted{color:var(--muted);font-size:12px;margin-top:8px}
  .sect{margin-top:26px}
</style></head>
<body>
<h1>联调预览 · 策略扫描 + 回写结果</h1>
<div class="sub">这是本地云端模拟器（与线上 /data 文件桥同契约）收到真实推送后，两个页面会渲染出的真实数据快照。数据来自 tdx-connector / westock-mcp 实时行情。</div>
<div id="app"></div>
<script>
const SCAN={"generatedAt": "2026-08-01 10:53:22", "period": {"beg": "20250101", "end": "20500101"}, "universeSize": 2, "selectedCount": 2, "selected": [{"code": "600519", "name": "贵州茅台", "score": 0.8, "momentum": 0.1307296508064404, "peTtm": 20.41, "pb": 7.25, "turnover": 0.44, "signals": 0}, {"code": "000858", "name": "五 粮 液", "score": 0.2, "momentum": 0.10434664183831122, "peTtm": 24.03, "pb": 2.57, "turnover": 1.28, "signals": 2}], "backtest": {"baseSignal": {"fastMa": 5, "slowMa": 10}, "baseMetrics": {"totalReturn": 0.027889460850718084, "annualReturn": 0.3517336824992481, "sharpe": 2.4408640766029737, "maxDrawdown": -0.01778586453813935, "winRate": 0.34782608695652173, "trades": 0}, "finalSignal": {"fastMa": 5, "slowMa": 10}, "finalMetrics": {"totalReturn": 0.027889460850718084, "annualReturn": 0.3517336824992481, "sharpe": 2.4408640766029737, "maxDrawdown": -0.01778586453813935, "winRate": 0.34782608695652173, "trades": 0}}, "equityCurve": [{"date": "20260630", "value": 1.0}, {"date": "20260701", "value": 1.0}, {"date": "20260702", "value": 1.0}, {"date": "20260703", "value": 1.0}, {"date": "20260706", "value": 1.0}, {"date": "20260707", "value": 1.0}, {"date": "20260708", "value": 1.0}, {"date": "20260709", "value": 1.0}, {"date": "20260710", "value": 1.0}, {"date": "20260713", "value": 1.0}, {"date": "20260714", "value": 1.0}, {"date": "20260715", "value": 0.9996}, {"date": "20260716", "value": 1.0001414386236793}, {"date": "20260717", "value": 0.992426131118938}, {"date": "20260720", "value": 1.0159780953779465}, {"date": "20260721", "value": 1.0033899553129233}, {"date": "20260722", "value": 1.005894066648605}, {"date": "20260723", "value": 1.0065031428014088}, {"date": "20260724", "value": 0.9979080465998375}, {"date": "20260727", "value": 1.0001414386236793}, {"date": "20260728", "value": 1.0062324776320781}, {"date": "20260729", "value": 1.0087365348252506}, {"date": "20260730", "value": 1.0316794229314548}, {"date": "20260731", "value": 1.027889460850718}], "disclaimer": "本结果基于历史数据回测，不构成投资建议，亦不进行真实资金下单。"};
const WB={"generatedAt": "2026-08-01T10:53:22", "dryRun": true, "channel": "tdx-connector（本环境仅查询工具，无 place_order；回写为模拟 dry-run）", "signals": [{"code": "600519", "name": "贵州茅台", "side": "BUY", "price": 1350.599976, "quantity": 100}, {"code": "000858", "name": "五 粮 液", "side": "BUY", "price": 78.0, "quantity": 100}], "note": "执行回写暂不可用：当前 tdx-connector 未提供下单接口。以上为候选回写信号，待接入带下单能力的券商 MCP 后切换为真实回写。"};
const yuan=v=>'¥'+Number(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=x=>(x>=0?'+':'')+(x*100).toFixed(2)+'%';
const app=document.getElementById('app');
let h='';

// ---- 策略扫描 ----
const fm=SCAN.backtest.finalMetrics, bs=SCAN.backtest.baseSignal, fs=SCAN.backtest.finalSignal;
h+='<div class="sect"><div class="eyebrow">交易 Agent · 文件桥</div><h2 style="margin:4px 0">策略扫描</h2>';
h+='<div class="sub">候选池 '+SCAN.universeSize+' 只 → 选出 '+SCAN.selectedCount+' 只 ｜ 生成于 '+SCAN.generatedAt+'</div>';
h+='<div class="grid">';
h+='<div class="stat"><div class="l">最终信号</div><div class="v">MA'+fs.fastMa+'/MA'+fs.slowMa+'</div></div>';
h+='<div class="stat"><div class="l">总收益</div><div class="v '+(fm.totalReturn>=0?'up':'down')+'">'+pct(fm.totalReturn)+'</div></div>';
h+='<div class="stat"><div class="l">年化收益</div><div class="v">'+pct(fm.annualReturn)+'</div></div>';
h+='<div class="stat"><div class="l">夏普比率</div><div class="v">'+fm.sharpe.toFixed(2)+'</div></div>';
h+='<div class="stat"><div class="l">最大回撤</div><div class="v">'+(fm.maxDrawdown!=null?pct(fm.maxDrawdown):'-')+'</div></div>';
h+='<div class="stat"><div class="l">日胜率</div><div class="v">'+pct(fm.winRate)+'</div></div>';
h+='</div>';
h+='<div class="card"><div style="font-weight:600;margin-bottom:8px">选股榜单（多因子打分）</div><table><thead><tr><th>代码</th><th>名称</th><th>得分</th><th>动量(20d)</th><th>PE</th><th>PB</th><th>换手%</th></tr></thead><tbody>';
for(const s of SCAN.selected){ h+='<tr><td>'+s.code+'</td><td>'+s.name+'</td><td>'+s.score.toFixed(3)+'</td><td class="'+(s.momentum>=0?'up':'down')+'">'+pct(s.momentum)+'</td><td>'+s.peTtm+'</td><td>'+s.pb+'</td><td>'+(s.turnover!=null?s.turnover.toFixed(2):'-')+'</td></tr>'; }
h+='</tbody></table></div>';
h+='<div class="muted">净值曲线点数：'+SCAN.equityCurve.length+'（页面内由 lightweight-charts 渲染）</div>';
h+='</div>';

// ---- 回写结果 ----
const total=WB.signals.reduce((a,s)=>a+s.price*s.quantity,0);
h+='<div class="sect"><div class="eyebrow">交易 Agent · 回写</div><h2 style="margin:4px 0">回写结果</h2>';
h+='<div class="sub">生成于 '+WB.generatedAt+' ｜ 候选信号 '+WB.signals.length+' 笔</div>';
h+= WB.dryRun ? '<div class="banner warn">当前为模拟回写（dry-run）：'+WB.channel+'</div>' : '<div class="banner">已真实回写</div>';
h+='<div class="grid">';
h+='<div class="stat"><div class="l">候选信号</div><div class="v">'+WB.signals.length+' 笔</div></div>';
h+='<div class="stat"><div class="l">预估金额合计</div><div class="v">'+yuan(total)+'</div></div>';
h+='<div class="stat"><div class="l">回写状态</div><div class="v">'+(WB.dryRun?'模拟':'已执行')+'</div></div>';
h+='</div>';
h+='<div class="card"><div style="font-weight:600;margin-bottom:8px">候选回写信号</div><table><thead><tr><th>代码</th><th>名称</th><th>方向</th><th>价格</th><th>数量</th><th>金额</th></tr></thead><tbody>';
for(const s of WB.signals){ const tone=s.side==='BUY'?'up':'down'; h+='<tr><td>'+s.code+'</td><td>'+s.name+'</td><td><span class="tag '+tone+'">'+(s.side==='BUY'?'买入':'卖出')+'</span></td><td>'+yuan(s.price)+'</td><td>'+s.quantity+'</td><td>'+yuan(s.price*s.quantity)+'</td></tr>'; }
h+='</tbody></table></div>';
h+='<div class="muted">回写通道：'+WB.channel+(WB.note?(' ｜ '+WB.note):'')+'</div>';
h+='</div>';

app.innerHTML=h;
</script>
</body></html>
