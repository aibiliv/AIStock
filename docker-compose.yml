services:
  fupanbu:
    build:
      context: .
      dockerfile: Dockerfile
    image: fupanbu-trading-journal:latest
    container_name: fupanbu
    # 生产访问地址：http://120.48.87.170:9001
    # 容器内 workerd 监听 8787，映射到宿主 9001
    ports:
      - "9001:8787"
    volumes:
      # 持久化 D1（本地 SQLite）数据，容器重建不丢数据
      - ./data:/data
    restart: unless-stopped
    # AI 模型源配置（可选）：不配置则应用自动降级为"自动解释"模式。
    # 值从宿主环境变量或同级 .env 文件读取（docker compose 自动加载 .env）。
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_BASE=${AI_API_BASE:-}
      - AI_MODEL=${AI_MODEL:-}
